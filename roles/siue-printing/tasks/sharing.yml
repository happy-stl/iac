---
# Serve the -win queues over IPPS to siue_print_share_clients and nobody else.
# Campus addresses are public, so CUPS's usual "@LOCAL" rule is not used.
# The queues are advertised over DNS-SD so Windows lists them; that reaches
# the whole subnet, but only the listed clients may connect.

- name: Listen for IPP on the network
  lineinfile:
    path: /etc/cups/cupsd.conf
    regexp: '^(Listen localhost:631|Port 631)$'
    line: Port 631
  become: yes
  notify: Restart cups

- name: Install Avahi for DNS-SD advertising and OpenSSL for the certificate
  package:
    name:
      - avahi
      - openssl
    state: present
  become: yes

- name: Run Avahi
  service:
    name: avahi-daemon
    enabled: yes
    state: started
  become: yes

- name: Advertise the shared queues
  lineinfile:
    path: /etc/cups/cupsd.conf
    regexp: '^{{ item.key }} '
    line: "{{ item.key }} {{ item.value }}"
  loop:
    - { key: Browsing, value: "Yes" }
    - { key: BrowseLocalProtocols, value: dnssd }
  become: yes
  notify: Restart cups

# CUPS otherwise makes a throwaway certificate that can change on restart,
# which would break the trust Windows has been given. Clients import this one.
- name: Create a long-lived TLS certificate for IPPS
  command: >-
    openssl req -x509 -newkey rsa:3072 -nodes -days 3650
    -keyout /etc/cups/ssl/{{ ansible_fqdn }}.key
    -out /etc/cups/ssl/{{ ansible_fqdn }}.crt
    -subj "/CN={{ ansible_fqdn }}"
    -addext "subjectAltName=DNS:{{ ansible_fqdn }},DNS:{{ ansible_hostname }},IP:{{ ansible_default_ipv4.address }}"
    -addext "basicConstraints=critical,CA:FALSE"
    -addext "keyUsage=critical,digitalSignature,keyEncipherment"
    -addext "extendedKeyUsage=serverAuth"
  args:
    creates: "/etc/cups/ssl/{{ ansible_fqdn }}.crt"
  become: yes
  notify: Restart cups

- name: Protect the TLS key
  file:
    path: "/etc/cups/ssl/{{ ansible_fqdn }}.key"
    mode: '0600'
  become: yes

# Fedora's cupsd is socket-activated on the local socket only and exits when
# idle, which would leave nothing listening on port 631.
- name: Keep cupsd running
  lineinfile:
    path: /etc/cups/cupsd.conf
    regexp: '^IdleExitTimeout '
    line: IdleExitTimeout 0
  become: yes
  notify: Restart cups

# cupsctl rewrites cupsd.conf without its comments, markers included, which
# would leave the previous block behind as a stray copy beside a new one.
- name: Remove shared-queue rules that lost their markers
  replace:
    path: /etc/cups/cupsd.conf
    regexp: '(?<!\(ansible managed\)\n)ServerAlias [^\n]*\n(?:<Location /printers/[^\n]*-win>\n(?:[^\n]*\n)*?</Location>\n)+'
    replace: ''
  become: yes
  notify: Restart cups

- name: Allow only the listed clients to reach the shared queues
  blockinfile:
    path: /etc/cups/cupsd.conf
    marker: "# {mark} siue-printing shared queues (ansible managed)"
    insertbefore: '^<Location />'
    block: |
      ServerAlias {{ ansible_hostname }} {{ ansible_fqdn }} {{ ansible_default_ipv4.address }}
      {% for q in siue_print_queues %}
      <Location /printers/{{ q.name }}-win>
        Encryption Required
        Order deny,allow
        Deny from all
        Allow from 127.0.0.1
      {% for client in siue_print_share_clients %}
        Allow from {{ client }}
      {% endfor %}
      </Location>
      {% endfor %}
  become: yes
  notify: Restart cups

- name: Check the edited CUPS configuration
  command: cupsd -t
  changed_when: false
  become: yes

- name: Open IPP in the firewall for the listed clients
  ansible.posix.firewalld:
    rich_rule: 'rule family="ipv4" source address="{{ item }}/32" port port="631" protocol="tcp" accept'
    permanent: yes
    immediate: yes
    state: enabled
  loop: "{{ siue_print_share_clients }}"
  become: yes
