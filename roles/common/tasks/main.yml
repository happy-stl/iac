---
- name: Install common packages (Linux)
  package:
    name: "{{ packages }}"
    state: present
  become: yes
  when: ansible_system == "Linux"

- name: Create common directories (Linux)
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop: "{{ directories }}"
  when: ansible_system == "Linux"

- name: Deploy tmux configuration (Linux)
  template:
    src: tmux.conf.j2
    dest: "{{ ansible_user_dir }}/.tmux.conf"
    mode: '0644'
  when: ansible_system == "Linux"

# kitty keeps the user's own kitty.conf; only an include line is added to it.
- name: Create the kitty config directory
  file:
    path: "{{ ansible_user_dir }}/.config/kitty"
    state: directory
    mode: '0755'
  when: ansible_system in ["Linux", "Darwin"]

- name: Install the kitty key bindings
  copy:
    src: kitty-keys.conf
    dest: "{{ ansible_user_dir }}/.config/kitty/iac-keys.conf"
    mode: '0644'
  when: ansible_system in ["Linux", "Darwin"]

- name: Load the key bindings from kitty.conf
  lineinfile:
    path: "{{ ansible_user_dir }}/.config/kitty/kitty.conf"
    line: include iac-keys.conf
    create: yes
    mode: '0644'
  when: ansible_system in ["Linux", "Darwin"]
