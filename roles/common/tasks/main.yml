---
- name: Install common packages (Linux)
  package:
    name: "{{ packages }}"
    state: present
  become: yes
  when: ansible_system == "Linux"

- name: Create common directories (Linux)
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop: "{{ directories }}"
  when: ansible_system == "Linux"

- name: Deploy tmux configuration (Linux)
  template:
    src: tmux.conf.j2
    dest: "{{ ansible_user_dir }}/.tmux.conf"
    mode: '0644'
  when: ansible_system == "Linux"

# Shift+Enter sends ESC+Enter (what Option/Alt+Enter sends), so Claude Code and
# shells see a new line even through tmux, which cannot ask kitty for its own
# Shift+Enter code. cmd+t only means something on macOS.
- name: Create the kitty config directory
  file:
    path: "{{ ansible_user_dir }}/.config/kitty"
    state: directory
    mode: '0755'
  when: ansible_system in ["Linux", "Darwin"]

- name: Deploy kitty configuration
  copy:
    src: kitty.conf
    dest: "{{ ansible_user_dir }}/.config/kitty/kitty.conf"
    mode: '0644'
  when: ansible_system in ["Linux", "Darwin"]
